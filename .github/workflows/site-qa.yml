name: Verificação do site Maison

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar todas as páginas
        run: python3 scripts/build_site.py
      - name: Verificar rotas, links, dados e WhatsApp
        run: python3 scripts/check-site.py
      - name: Verificar a V8
        run: python3 scripts/check-v8.py
      - name: Verificar experiência de tratamentos V9
        run: python3 scripts/check-v9.py
      - name: Verificar a jornada guiada mobile V10
        run: python3 scripts/check-mobile-quiz.py
      - name: Validar narrativa mobile V11
        run: python3 scripts/check-story-v11.py
      - name: Confirmar que o gerador reproduz o HTML publicado
        run: git diff --exit-code -- *.html
      - name: Verificar sintaxe do JavaScript
        run: |
          node --check assets/js/maison.js
          node --check assets/js/maison-concierge.js
          node --check assets/js/maison-mobile-quiz.js
          node --check assets/js/maison-story-v11.js
      - name: Testar interação das categorias no JavaScript
        run: node --test tests/concierge-interaction.test.cjs tests/mobile-quiz.test.cjs tests/story-v11.test.cjs
